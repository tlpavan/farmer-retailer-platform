# ===== Server =====
server.port=8080

# ===== H2 In-Memory Database (no install needed) =====
spring.datasource.url=jdbc:h2:mem:farmtradedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# 256-bit secret for HS256 signing - change this in production
app.jwt.secret=ZmFybXRyYWRlU2VjcmV0S2V5Rm9ySnd0U2lnbmluZ011c3RCZTI1NkJpdHNPckxvbmdlcg==
app.jwt.expiration-ms=86400000

# ===== MySQL (uncomment + comment out H2 block above, if you prefer MySQL) =====
